<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>QQQ ↔ TQQQ Alert</title>
  <style>
    :root{color-scheme:dark;--bg:#090d14;--card:#111925;--line:#253246;--muted:#8da0b8;--text:#edf4ff;--green:#46d69a;--orange:#ffb454;--red:#ff667a}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#17253b 0,transparent 35%),var(--bg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
    main{width:min(1120px,calc(100% - 32px));margin:38px auto 70px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}h1{font-size:clamp(26px,5vw,44px);margin:0;letter-spacing:-1.5px}header p{margin:5px 0;color:var(--muted)}
    .badge{padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:#0c131e;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 16px 50px #0004}.label{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}.value{font-size:28px;font-weight:750;margin-top:5px}.orange{color:var(--orange)}.green{color:var(--green)}.red{color:var(--red)}
    section{margin-top:18px}h2{font-size:18px;margin:0 0 14px}.chart{height:300px;position:relative}svg{width:100%;height:100%;overflow:visible}.axis{stroke:#34445b;stroke-width:1}.equity{fill:none;stroke:var(--green);stroke-width:2}.area{fill:url(#fade)}
    table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted)}tr:last-child td{border-bottom:0}.action{font-weight:700}footer{color:var(--muted);margin-top:24px;font-size:13px}
    @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}header{align-items:start;flex-direction:column}.chart{height:230px}}@media(max-width:470px){.grid{grid-template-columns:1fr}.table-wrap{overflow:auto}}
  </style>
</head>
<body><main>
  <header><div><h1>QQQ ↔ TQQQ Alert</h1><p id="subtitle"></p></div><div class="badge" id="updated"></div></header>
  <div class="grid">
    <div class="card"><div class="label">模型持仓</div><div class="value" id="holding"></div></div>
    <div class="card"><div class="label">QQQ 收盘</div><div class="value" id="close"></div></div>
    <div class="card"><div class="label">距参考前高</div><div class="value" id="drawdown"></div></div>
    <div class="card"><div class="label" id="level-label"></div><div class="value" id="level"></div></div>
  </div>
  <section class="card"><h2>策略净值（最近配置年限）</h2><div class="chart"><svg id="chart" viewBox="0 0 1000 300" preserveAspectRatio="none"></svg></div></section>
  <section class="grid">
    <div class="card"><div class="label">历史年化</div><div class="value" id="cagr"></div></div>
    <div class="card"><div class="label">历史最大回撤</div><div class="value red" id="mdd"></div></div>
    <div class="card"><div class="label">Sharpe（无风险利率=0）</div><div class="value" id="sharpe"></div></div>
    <div class="card"><div class="label">换仓次数</div><div class="value" id="switches"></div></div>
  </section>
  <section class="card"><h2>最近信号</h2><div class="table-wrap"><table><thead><tr><th>日期</th><th>动作</th><th>QQQ 收盘</th><th>参考前高</th><th>回撤</th></tr></thead><tbody id="signals"></tbody></table></div></section>
  <footer>收盘确认、下一交易日执行；历史结果不代表未来表现。本页面不执行交易，也不构成投资建议。</footer>
</main>
<script>
const d=__DASHBOARD_DATA__,s=d.status,m=d.metrics,money=n=>'$'+n.toFixed(2),pct=n=>n.toFixed(2)+'%';
document.querySelector('#subtitle').textContent=`QQQ 从前高回撤 ${d.config.drawdown_percent}% 切换 TQQQ，恢复前高切回 QQQ`;
document.querySelector('#updated').textContent='数据截至 '+s.as_of;
const hold=document.querySelector('#holding');hold.textContent=s.holding;hold.className='value '+(s.holding==='TQQQ'?'orange':'green');
document.querySelector('#close').textContent=money(s.qqq_close);const dd=document.querySelector('#drawdown');dd.textContent=pct(s.current_drawdown_percent);dd.className='value '+(s.current_drawdown_percent<0?'orange':'green');
const recovery=s.holding==='TQQQ';document.querySelector('#level-label').textContent=recovery?'换回 QQQ 目标':'换成 TQQQ 触发价';document.querySelector('#level').textContent=money(recovery?s.recovery_price:s.trigger_price);
document.querySelector('#cagr').textContent=pct(m.cagr_percent);document.querySelector('#mdd').textContent=pct(m.max_drawdown_percent);document.querySelector('#sharpe').textContent=m.sharpe_no_risk_free.toFixed(2);document.querySelector('#switches').textContent=m.switch_count;
document.querySelector('#signals').innerHTML=d.signals.map(x=>`<tr><td>${x.date}</td><td class="action ${x.action.includes('TQQQ')?'orange':'green'}">${x.action==='SWITCH_TO_TQQQ'?'QQQ → TQQQ':'TQQQ → QQQ'}</td><td>${money(x.qqq_close)}</td><td>${money(x.reference_high)}</td><td>${pct(x.drawdown_percent)}</td></tr>`).join('');
const v=d.curve.map(x=>x.value),lo=Math.min(...v),hi=Math.max(...v),pad=18,w=1000,h=300,x=i=>pad+i/(v.length-1)*(w-2*pad),y=n=>h-pad-(n-lo)/(hi-lo||1)*(h-2*pad),points=v.map((n,i)=>`${x(i)},${y(n)}`).join(' '),svg=document.querySelector('#chart');
svg.innerHTML=`<defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46d69a" stop-opacity=".28"/><stop offset="1" stop-color="#46d69a" stop-opacity="0"/></linearGradient></defs><line class="axis" x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}"/><polygon class="area" points="${pad},${h-pad} ${points} ${w-pad},${h-pad}"/><polyline class="equity" points="${points}"/>`;
</script></body></html>
